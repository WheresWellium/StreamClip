# StreamClip desktop / single-machine profile (ADR-001 §4.1–4.2)
# Embedded runtime: SQLite + in-process queue (no Docker, Celery, or Redis).
#
# Usage:
#   set STREAMCLIP_CONFIG=config/desktop.yaml
#   alembic upgrade head
#   uvicorn backend.main:create_app --factory
#
# Override database path via env:
#   set STREAMCLIP_DATABASE__URL=sqlite+aiosqlite:///C:/path/to/streamclip.db
#   set STREAMCLIP_DATABASE__SYNC_URL=sqlite:///C:/path/to/streamclip.db

database:
  # Workspace-relative DB for dev; production desktop uses %LOCALAPPDATA%\StreamClip (or ~/Library/Application Support/StreamClip)
  url: sqlite+aiosqlite:///./workspace/streamclip.db
  sync_url: sqlite:///./workspace/streamclip.db

storage:
  backend: local
  local_root: workspace/storage

queue:
  backend: inprocess
  default_workers: 2
  gpu_workers: 1

# CPU desktop beta throughput (performance audit 2026-07-28; user chose medium whisper).
# Without these overrides the sidecar inherits pydantic defaults (large-v3, refine clips, optical flow).
whisper:
  model_size: medium
  device: cpu
  compute_type: int8

caption:
  refine_clip_transcript: false

highlight:
  weight_optical_flow: 0
  weight_llm_virality: 0.55

ingest:
  medium_skip_optical_flow: true

# GPU (§4.11): sidecar calls core/gpu_profile.py at boot — upgrades to CUDA/NVENC
# when detected, falls back to cpu/libx264 when not. Override via STREAMCLIP_WHISPER__DEVICE
# and STREAMCLIP_EXPORT__CODEC.

ffmpeg:
  bin_dir: bin/ffmpeg

# Desktop LLM (§4.4): no bundled Ollama. Point at a hosted provider via env:
#   set STREAMCLIP_LLM__PROVIDER=openai        (or anthropic)
#   set STREAMCLIP_LLM__MODEL=gpt-4o-mini
#   set STREAMCLIP_LLM__API_KEY=sk-...
# Without a key, virality LLM scoring degrades to 0 and the audio/visual
# ensemble still ranks clips. Local Ollama also works if installed.
llm:
  provider: ollama
  base_url: http://localhost:11434
  timeout_secs: 30

rate_limit:
  enabled: false

web:
  serve_static: true
  static_dir: static/ui

# Social distribution (OAuth redirects must match the Electron UI origin).
# Generate Fernet key: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   set STREAMCLIP_DISTRIBUTION__TOKEN_ENCRYPTION_KEY=...
distribution:
  web_origin: http://127.0.0.1:8765
  youtube_publish_enabled: true
  # Keep off until TikTok developer app audit grants video.publish / inbox approval.
  tiktok_publish_enabled: false
