# qClip Docs (henna) — customer site only; see docs/INTERNAL.md for excluded pages
# Build: pip install -r docs/requirements.txt && python -m mkdocs build --strict
# Dev:   python -m mkdocs serve -a 127.0.0.1:8001
# Deploy: Vercel (vercel.json) — https://streamclip-henna.vercel.app/

site_name: qClip
site_description: Download qClip and make your first clip
site_url: https://streamclip-henna.vercel.app/
repo_url: https://github.com/WheresWellium/StreamClip
repo_name: streamclip
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 Wellium — FJ Cantwell II

docs_dir: docs
site_dir: site
strict: true

# Customer henna = one page (download + how to use). Everything else stays in-repo.
# See docs/INTERNAL.md for the full internal register.
exclude_docs: |
  GAP_ANALYSIS.md
  MASTER_TODO.md
  INTERNAL.md
  OPS_ALERTING.md
  BETA_OPS_PHASE0.md
  BETA_GO_LIVE.md
  BETA_ON_CALL.md
  BETA_INVITE_PACK.md
  BETA_TESTER_PLAN.md
  BETA_COHORT_EXIT.md
  BETA_DISTRIBUTION.md
  BETA_OBSERVABILITY.md
  BETA_DOWNLOAD.md
  BETA_TESTER_QUICKSTART.md
  BETA_FAQ.md
  BETA_KNOWN_ISSUES.md
  SESSION_STATE.md
  AGENT_COORDINATION.md
  MACOS_INSTALLER.md
  DESKTOP_SIGNING.md
  CLEAN_VM_VERIFY.md
  CREATOR_PLATFORM.md
  PERFORMANCE.md
  TECHNICAL_DESIGN.md
  THEME_SKINS.md
  FIGMA_LINKS.md
  ADR-001-desktop-packaging.md
  cloud-deploy.md
  distribution-runbook.md
  .agent-lock.example.json
  commercial/
  evidence/
  superpowers/
  design/
  tutorials/
  share/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.top
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Single customer page: download + how to use
nav:
  - Home: index.md

extra:
  generator: false
