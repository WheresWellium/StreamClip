# qClip — public documentation site (Wellium)
# Build: pip install -r docs/requirements.txt && python -m mkdocs build --strict
# Dev:   python -m mkdocs serve -a 127.0.0.1:8001
# Live:  https://streamclip-henna.vercel.app/

site_name: qClip Docs
site_description: Install qClip, run your first clip, and get help — desktop app, no Docker required
site_url: https://streamclip-henna.vercel.app/
repo_url: https://github.com/WheresWellium/StreamClip
repo_name: qClip
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 Wellium — FJ Cantwell II

docs_dir: docs
site_dir: site
strict: true

# Internal / operator — kept in-repo, not published on henna
exclude_docs: |
  GAP_ANALYSIS.md
  MASTER_TODO.md
  INTERNAL.md
  OPS_ALERTING.md
  BETA_OPS_PHASE0.md
  BETA_GO_LIVE.md
  BETA_ON_CALL.md
  BETA_INVITE_PACK.md
  BETA_TESTER_PLAN.md
  SESSION_STATE.md
  AGENT_COORDINATION.md
  DESKTOP_SOLO_GATE.md
  DESKTOP_SIGNING.md
  HUMAN_DESKTOP_SMOKE.md
  RELEASE_CHECKLIST.md
  RELEASE_NOTES_beta.6.md
  DESKTOP_STARTUP.md
  .agent-lock.example.json

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Install:
      - Desktop install guide: DESKTOP_SOLO_USER_GUIDE.md
      - Get your installer: BETA_DOWNLOAD.md
      - 15-minute quickstart: BETA_TESTER_QUICKSTART.md
  - Using qClip:
      - Your first clip: tutorials/TUTORIAL_FIRST_JOB.md
      - Edit & approve: tutorials/TUTORIAL_EDIT_APPROVE.md
      - Publish to YouTube: tutorials/TUTORIAL_PUBLISH_YOUTUBE.md
      - Clip Vault: tutorials/TUTORIAL_VAULT.md
      - GPU setup (Windows): tutorials/TUTORIAL_GPU_SETUP.md
  - Help:
      - Troubleshooting: tutorials/TUTORIAL_TROUBLESHOOTING.md
      - Known issues: BETA_KNOWN_ISSUES.md
  - For builders:
      - macOS DMG (Apple Silicon): MACOS_INSTALLER.md
  - Design:
      - Figma links: design/FIGMA_LINKS.md

extra:
  generator: false
