# Build Windows NSIS installer and macOS DMG; publish to GitHub Releases.
# Trigger: push tag v* (e.g. v1.0.0) or manual workflow_dispatch.
# Download URL (stable): .../releases/latest/download/qClip-Setup-win-x64.exe
# macOS product path: qClip-mac-arm64.dmg (unsigned OK when Apple secrets absent)
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0-beta.1)"
        required: false
        default: "1.0.0-beta.1"
      require_signed:
        description: "Fail if WINDOWS_CSC_* secrets missing (EV signing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag or input
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ref = "${{ github.ref_name }}"
            if ($ref -match '^v(.+)$') { $ver = $Matches[1] }
          }
          if (-not $ver) { $ver = "0.0.0-ci" }
          Write-Host "Building version $ver"
          node --input-type=commonjs -e @"
          const fs = require('fs');
          const path = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.argv[1];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "@ -- $ver

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/desktop/package-lock.json

      - name: Desktop signing preflight
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          STREAMCLIP_REQUIRE_SIGNED_INSTALLER: ${{ github.event.inputs.require_signed == true && '1' || '' }}
        run: |
          .\scripts\verify_desktop_signing_ready.ps1 @(
            $(if ($env:STREAMCLIP_REQUIRE_SIGNED_INSTALLER -eq '1') { '-RequireSigning' })
          )

      - name: Install Python packaging deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt -r requirements-packaging.txt

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Electron deps
        working-directory: apps/desktop
        run: npm ci

      - name: Download ffmpeg Windows binaries
        shell: pwsh
        run: .\scripts\download_ffmpeg_windows.ps1

      - name: Build NSIS installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: .\scripts\build_desktop_installer.ps1

      - name: Verify installer + update metadata
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter "qClip-Setup-win-x64.exe" -ErrorAction Stop
          $mb = [math]::Round($exe.Length / 1MB)
          Write-Host "Installer: $($exe.FullName) ($mb MB)"
          if (-not (Test-Path apps/desktop/release/latest.yml)) {
            Write-Error "latest.yml missing — electron-updater metadata required for auto-update"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: qClip ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          files: |
            apps/desktop/release/qClip-Setup-win-x64.exe
            apps/desktop/release/latest.yml
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Apple Silicon DMG (§5). Job continue-on-error so missing Apple secrets / ML
  # wheel flakes never block the Windows release. When the DMG builds, upload it
  # as a workflow artifact (and attach to the GitHub Release on tags).
  macos-installer:
    runs-on: macos-latest
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Host arch check
        run: |
          echo "Runner: $(uname -s) $(uname -m)"
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::warning::Runner is not arm64 — product artifact is qClip-mac-arm64.dmg; electron-builder --arm64 may cross-compile or fail."
          fi

      - name: Set version from tag or input
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            REF="${{ github.ref_name }}"
            case "$REF" in v*) VER="${REF#v}" ;; esac
          fi
          VER="${VER:-0.0.0-ci}"
          echo "Building version $VER"
          node --input-type=commonjs -e "
          const fs = require('fs');
          const path = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.argv[1];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          " -- "$VER"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop-macos.txt
            requirements-packaging.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/desktop/package-lock.json

      - name: Configure macOS signing env (omit empty secrets)
        env:
          CSC_LINK_SECRET: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          CSC_NAME_SECRET: ${{ secrets.MACOS_CSC_NAME }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_SECRET: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # Never export empty CSC_*/APPLE_* into the build step env.
          # electron-builder treats CSC_LINK="" as a cert path → "<workdir> not a file".
          if [ -n "$CSC_LINK_SECRET" ] && [ -n "$CSC_KEY_PASSWORD_SECRET" ]; then
            {
              echo "CSC_LINK<<EOF"
              echo "$CSC_LINK_SECRET"
              echo "EOF"
              echo "CSC_KEY_PASSWORD<<EOF"
              echo "$CSC_KEY_PASSWORD_SECRET"
              echo "EOF"
            } >> "$GITHUB_ENV"
            echo "Apple CSC_LINK present — electron-builder will codesign."
          elif [ -n "$CSC_NAME_SECRET" ]; then
            echo "CSC_NAME=$CSC_NAME_SECRET" >> "$GITHUB_ENV"
            echo "Apple CSC_NAME present — electron-builder will codesign."
          else
            echo "No MACOS_CSC_* / CSC_NAME secrets — building UNSIGNED DMG."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          [ -n "$APPLE_ID_SECRET" ] && echo "APPLE_ID=$APPLE_ID_SECRET" >> "$GITHUB_ENV"
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD_SECRET" ] && echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD_SECRET" >> "$GITHUB_ENV"
          [ -n "$APPLE_TEAM_ID_SECRET" ] && echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET" >> "$GITHUB_ENV"
          [ -n "$APPLE_API_KEY_SECRET" ] && echo "APPLE_API_KEY=$APPLE_API_KEY_SECRET" >> "$GITHUB_ENV"
          [ -n "$APPLE_API_KEY_ID_SECRET" ] && echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"
          [ -n "$APPLE_API_ISSUER_SECRET" ] && echo "APPLE_API_ISSUER=$APPLE_API_ISSUER_SECRET" >> "$GITHUB_ENV"

      - name: Install Python desktop + packaging deps (macOS wheels)
        run: |
          python3 -m pip install --upgrade pip
          # Do NOT use requirements-desktop.txt (CPU torch index) on Darwin.
          python3 -m pip install -r requirements-desktop-macos.txt -r requirements-packaging.txt

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Electron deps
        working-directory: apps/desktop
        run: npm ci

      - name: Download ffmpeg macOS arm64 binaries
        run: |
          chmod +x scripts/download_ffmpeg_macos.sh
          ./scripts/download_ffmpeg_macos.sh --arm64
          test -x bin/ffmpeg/ffmpeg && test -x bin/ffmpeg/ffprobe

      - name: Build macOS DMG (arm64)
        id: build_dmg
        env:
          # Signing vars come only from the prior step via GITHUB_ENV (never empty "").
          # Allow Intel runners in GH if macos-latest ever regresses; product still --arm64.
          STREAMCLIP_ALLOW_NON_ARM64: "1"
        run: |
          chmod +x scripts/build_desktop_installer_macos.sh \
            scripts/build_desktop_ui.sh \
            scripts/notarize_macos_artifact.sh \
            scripts/verify_desktop_installer_macos.sh
          ./scripts/build_desktop_installer_macos.sh

      - name: Verify DMG artifact
        if: always() && steps.build_dmg.outcome == 'success'
        run: |
          test -f apps/desktop/release/qClip-mac-arm64.dmg
          ./scripts/verify_desktop_installer_macos.sh apps/desktop/release/qClip-mac-arm64.dmg

      - name: Upload unsigned/signed DMG workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qClip-mac-arm64-dmg
          path: apps/desktop/release/qClip-mac-arm64.dmg
          if-no-files-found: warn
          retention-days: 14

      - name: Attach DMG to GitHub Release (tag builds)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/desktop/release/qClip-mac-arm64.dmg
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
