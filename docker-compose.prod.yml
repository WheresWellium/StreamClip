# ═══════════════════════════════════════════════════════════════════════
# StreamClip — Production docker-compose (pinned GHCR images, no bind-mounts)
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# GPU:   docker compose -f docker-compose.prod.yml --env-file .env.production --profile gpu up -d
#        Set STREAMCLIP_WORKER_QUEUES=default so GPU tasks run only on gpu-worker.
# ═══════════════════════════════════════════════════════════════════════

x-streamclip-db-env: &streamclip-db-env
  STREAMCLIP_DATABASE__URL: postgresql+asyncpg://${POSTGRES_USER:-streamclip}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-streamclip}
  STREAMCLIP_DATABASE__SYNC_URL: postgresql+psycopg://${POSTGRES_USER:-streamclip}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-streamclip}

x-streamclip-redis-env: &streamclip-redis-env
  STREAMCLIP_REDIS__URL: redis://redis:6379/0
  STREAMCLIP_CELERY__BROKER_URL: redis://redis:6379/1
  STREAMCLIP_CELERY__RESULT_BACKEND: redis://redis:6379/2

x-streamclip-storage-env: &streamclip-storage-env
  STREAMCLIP_STORAGE__BACKEND: minio
  STREAMCLIP_STORAGE__ENDPOINT_URL: http://minio:9000
  # MUST be a browser-reachable URL (not the internal `minio:9000` Docker hostname) —
  # used to sign presigned GET/PUT URLs returned to the browser for playback,
  # thumbnails, downloads, and uploads. Both api and worker generate presigned URLs.
  STREAMCLIP_STORAGE__PUBLIC_BASE_URL: ${STREAMCLIP_PUBLIC_BASE_URL:-http://localhost:9000}
  STREAMCLIP_STORAGE__BUCKET: ${MINIO_BUCKET:-streamclip}
  STREAMCLIP_STORAGE__ACCESS_KEY: ${MINIO_ROOT_USER}
  STREAMCLIP_STORAGE__SECRET_KEY: ${MINIO_ROOT_PASSWORD}

x-streamclip-distribution-env: &streamclip-distribution-env
  STREAMCLIP_DISTRIBUTION__WEB_ORIGIN: ${STREAMCLIP_DISTRIBUTION__WEB_ORIGIN:-${NEXT_PUBLIC_APP_URL:-http://localhost:3000}}
  STREAMCLIP_DISTRIBUTION__TOKEN_ENCRYPTION_KEY: ${STREAMCLIP_DISTRIBUTION__TOKEN_ENCRYPTION_KEY:-}
  STREAMCLIP_DISTRIBUTION__YOUTUBE_PUBLISH_ENABLED: ${STREAMCLIP_DISTRIBUTION__YOUTUBE_PUBLISH_ENABLED:-true}
  STREAMCLIP_DISTRIBUTION__TIKTOK_PUBLISH_ENABLED: ${STREAMCLIP_DISTRIBUTION__TIKTOK_PUBLISH_ENABLED:-false}
  STREAMCLIP_DISTRIBUTION__YOUTUBE_CLIENT_ID: ${STREAMCLIP_DISTRIBUTION__YOUTUBE_CLIENT_ID:-}
  STREAMCLIP_DISTRIBUTION__YOUTUBE_CLIENT_SECRET: ${STREAMCLIP_DISTRIBUTION__YOUTUBE_CLIENT_SECRET:-}
  STREAMCLIP_DISTRIBUTION__TIKTOK_CLIENT_KEY: ${STREAMCLIP_DISTRIBUTION__TIKTOK_CLIENT_KEY:-}
  STREAMCLIP_DISTRIBUTION__TIKTOK_CLIENT_SECRET: ${STREAMCLIP_DISTRIBUTION__TIKTOK_CLIENT_SECRET:-}

x-streamclip-smtp-env: &streamclip-smtp-env
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-streamclip@localhost}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  BUG_REPORT_TO: ${BUG_REPORT_TO:-}
  OPS_WEBHOOK_URL: ${OPS_WEBHOOK_URL:-}
  STREAMCLIP_OBSERVABILITY__SENTRY_DSN: ${STREAMCLIP_OBSERVABILITY__SENTRY_DSN:-}

x-streamclip-worker-volumes: &streamclip-worker-volumes
  - workspace_data:/app/workspace
  - cache_data:/app/.cache
  - assets_data:/app/assets

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-streamclip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-streamclip}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-streamclip}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-30Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/$${MINIO_BUCKET:-streamclip} &&
        echo 'MinIO bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-streamclip}

  ollama:
    image: ollama/ollama:0.5.4
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api:
    image: ${STREAMCLIP_IMAGE_PREFIX:-ghcr.io/streamclip}/api:${STREAMCLIP_VERSION:-latest}
    command: >
      sh -c "python scripts/seed_assets_if_empty.py &&
             alembic upgrade head &&
             uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 2"
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: [*streamclip-db-env, *streamclip-redis-env, *streamclip-storage-env, *streamclip-distribution-env, *streamclip-smtp-env]
      STREAMCLIP_ENVIRONMENT: production
      STREAMCLIP_AUTH__SECRET_KEY: ${STREAMCLIP_AUTH_SECRET_KEY:?set STREAMCLIP_AUTH_SECRET_KEY}
      STREAMCLIP_AUTH__ALLOW_ANONYMOUS: ${STREAMCLIP_AUTH_ALLOW_ANONYMOUS:-true}
      STREAMCLIP_AUTH__DEVICE_SCOPED_ANONYMOUS: "true"
      STREAMCLIP_LLM__BASE_URL: http://ollama:11434
      STREAMCLIP_COMMERCE__LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      STREAMCLIP_COMMERCE__LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-}
      STREAMCLIP_COMMERCE__LEMON_SQUEEZY_BETA_VARIANT_ID: ${STREAMCLIP_COMMERCE__LEMON_SQUEEZY_BETA_VARIANT_ID:-}
      STREAMCLIP_COMMERCE__LEMON_SQUEEZY_PRO_VARIANT_ID: ${STREAMCLIP_COMMERCE__LEMON_SQUEEZY_PRO_VARIANT_ID:-}
      STREAMCLIP_RATE_LIMIT__ENABLED: ${STREAMCLIP_RATE_LIMIT__ENABLED:-true}
      STREAMCLIP_OBSERVABILITY__METRICS_API_KEY: ${STREAMCLIP_OBSERVABILITY__METRICS_API_KEY:-}
      STREAMCLIP_LOG_JSON: "true"
    volumes:
      - workspace_data:/app/workspace
      - cache_data:/app/.cache
      - assets_data:/app/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: ${STREAMCLIP_IMAGE_PREFIX:-ghcr.io/streamclip}/worker:${STREAMCLIP_VERSION:-latest}
    command: >
      sh -c "python scripts/seed_assets_if_empty.py &&
             celery -A core.celery_app.celery_app worker
               --loglevel=info
               --queues=$${STREAMCLIP_WORKER_QUEUES:-default,gpu}
               --concurrency=4"
    environment:
      <<: [*streamclip-db-env, *streamclip-redis-env, *streamclip-storage-env, *streamclip-distribution-env, *streamclip-smtp-env]
      # Default is CPU-safe all-in-one (consumes both queues so GPU-routed tasks like
      # run_transcribe/process_clip still execute without a GPU worker). Operators
      # running an isolated `gpu-worker` (--profile gpu) should set this to "default"
      # on the main worker so GPU tasks only run on gpu-worker.
      STREAMCLIP_WORKER_QUEUES: ${STREAMCLIP_WORKER_QUEUES:-default,gpu}
      STREAMCLIP_LLM__BASE_URL: http://ollama:11434
      STREAMCLIP_WHISPER__DEVICE: cpu
      STREAMCLIP_WHISPER__COMPUTE_TYPE: int8
      STREAMCLIP_EXPORT__CODEC: libx264
    volumes: *streamclip-worker-volumes
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  gpu-worker:
    profiles: [gpu]
    image: ${STREAMCLIP_IMAGE_PREFIX:-ghcr.io/streamclip}/worker:${STREAMCLIP_VERSION:-latest}
    command: >
      sh -c "python scripts/seed_assets_if_empty.py &&
             celery -A core.celery_app.celery_app worker
               --loglevel=info
               --queues=gpu
               --concurrency=1
               --max-tasks-per-child=20"
    environment:
      <<: [*streamclip-db-env, *streamclip-redis-env, *streamclip-storage-env, *streamclip-distribution-env]
      STREAMCLIP_LLM__BASE_URL: http://ollama:11434
      STREAMCLIP_WHISPER__DEVICE: cuda
      STREAMCLIP_WHISPER__COMPUTE_TYPE: float16
      STREAMCLIP_EXPORT__CODEC: h264_nvenc
    volumes: *streamclip-worker-volumes
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  beat:
    image: ${STREAMCLIP_IMAGE_PREFIX:-ghcr.io/streamclip}/worker:${STREAMCLIP_VERSION:-latest}
    command: celery -A core.celery_app.celery_app beat --loglevel=info
    environment:
      <<: [*streamclip-db-env, *streamclip-redis-env, *streamclip-storage-env, *streamclip-smtp-env]
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ${STREAMCLIP_IMAGE_PREFIX:-ghcr.io/streamclip}/web:${STREAMCLIP_VERSION:-latest}
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
  workspace_data:
  cache_data:
  assets_data:
