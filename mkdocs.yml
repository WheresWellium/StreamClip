# qClip — public documentation site (Wellium)
# Build: pip install -r docs/requirements.txt && python -m mkdocs build --strict
# Dev:   python -m mkdocs serve -a 127.0.0.1:8001
# Deploy: Vercel (vercel.json) — see README § Documentation

site_name: qClip Docs
site_description: Wellium — self-hosted AI clip pipeline guides and architecture
site_url: https://streamclip-henna.vercel.app/
repo_url: https://github.com/WheresWellium/StreamClip
repo_name: qClip
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 Wellium — FJ Cantwell II

docs_dir: docs
site_dir: site
strict: true

# Internal engineering registers — kept in-repo, never published (see docs/INTERNAL.md)
exclude_docs: |
  GAP_ANALYSIS.md
  MASTER_TODO.md
  INTERNAL.md
  OPS_ALERTING.md
  BETA_OPS_PHASE0.md
  BETA_GO_LIVE.md
  BETA_ON_CALL.md
  BETA_INVITE_PACK.md
  SESSION_STATE.md
  AGENT_COORDINATION.md
  .agent-lock.example.json

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Download:
      - Get qClip (Windows & Mac): BETA_DOWNLOAD.md
      - macOS DMG builders: MACOS_INSTALLER.md
  - Getting started:
      - Beta quickstart: BETA_TESTER_QUICKSTART.md
      - Beta test plan: BETA_TESTER_PLAN.md
      - Known issues: BETA_KNOWN_ISSUES.md
      - Human desktop smoke: HUMAN_DESKTOP_SMOKE.md
      - Desktop solo user guide: DESKTOP_SOLO_USER_GUIDE.md
      - Desktop solo gate: DESKTOP_SOLO_GATE.md
      - Release checklist: RELEASE_CHECKLIST.md
      - Desktop signing: DESKTOP_SIGNING.md
  - Tutorials:
      - Install (desktop): tutorials/TUTORIAL_INSTALL.md
      - First job: tutorials/TUTORIAL_FIRST_JOB.md
      - Edit & approve: tutorials/TUTORIAL_EDIT_APPROVE.md
      - Publish to YouTube: tutorials/TUTORIAL_PUBLISH_YOUTUBE.md
      - Clip Vault: tutorials/TUTORIAL_VAULT.md
      - GPU setup: tutorials/TUTORIAL_GPU_SETUP.md
      - Troubleshooting: tutorials/TUTORIAL_TROUBLESHOOTING.md
  - Design:
      - Figma links: design/FIGMA_LINKS.md

extra:
  generator: false
