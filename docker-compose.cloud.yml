# StreamClip Cloud — skeleton compose (extend for managed Postgres / K8s)
# Not for local dev — use docker-compose.yml instead.

services:
  api:
    image: ghcr.io/streamclip/api:${STREAMCLIP_VERSION:-latest}
    environment:
      STREAMCLIP_ENVIRONMENT: production
      STREAMCLIP_CLOUD_MODE: "true"
      STREAMCLIP_DATABASE__URL: ${DATABASE_URL:?set DATABASE_URL}
      STREAMCLIP_REDIS__URL: ${REDIS_URL:?set REDIS_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    image: ghcr.io/streamclip/worker:${STREAMCLIP_VERSION:-latest}
    environment:
      STREAMCLIP_ENVIRONMENT: production
      STREAMCLIP_CLOUD_MODE: "true"
      STREAMCLIP_DATABASE__URL: ${DATABASE_URL}
      STREAMCLIP_REDIS__URL: ${REDIS_URL}
      STREAMCLIP_CELERY__BROKER_URL: ${CELERY_BROKER_URL:-${REDIS_URL}}
    restart: unless-stopped
    deploy:
      replicas: 2

  web:
    image: ghcr.io/streamclip/web:${STREAMCLIP_VERSION:-latest}
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
