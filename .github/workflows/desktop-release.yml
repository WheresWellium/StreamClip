# Build Windows NSIS installer and publish to GitHub Releases.
# Trigger: push tag v* (e.g. v1.0.0) or manual workflow_dispatch.
# Download URL (stable): .../releases/latest/download/qClip-Setup-win-x64.exe
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0-beta.6)"
        required: false
        default: "1.0.0-beta.6"
      require_signed:
        description: "Fail if WINDOWS_CSC_* secrets missing (EV signing)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag or input
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ref = "${{ github.ref_name }}"
            if ($ref -match '^v(.+)$') { $ver = $Matches[1] }
          }
          if (-not $ver) { $ver = "0.0.0-ci" }
          Write-Host "Building version $ver"
          node --input-type=commonjs -e @"
          const fs = require('fs');
          const path = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.argv[1];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "@ -- $ver

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/desktop/package-lock.json

      - name: Desktop signing preflight
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          STREAMCLIP_REQUIRE_SIGNED_INSTALLER: ${{ github.event.inputs.require_signed == true && '1' || '' }}
        run: |
          .\scripts\verify_desktop_signing_ready.ps1 @(
            $(if ($env:STREAMCLIP_REQUIRE_SIGNED_INSTALLER -eq '1') { '-RequireSigning' })
          )

      - name: Install Python packaging deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt -r requirements-packaging.txt

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Electron deps
        working-directory: apps/desktop
        run: npm ci

      - name: Download ffmpeg Windows binaries
        shell: pwsh
        run: .\scripts\download_ffmpeg_windows.ps1

      - name: Build NSIS installer
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: .\scripts\build_desktop_installer.ps1

      - name: Verify installer + update metadata
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter "qClip-Setup-win-x64.exe" -ErrorAction Stop
          $mb = [math]::Round($exe.Length / 1MB)
          Write-Host "Installer: $($exe.FullName) ($mb MB)"
          if (-not (Test-Path apps/desktop/release/latest.yml)) {
            Write-Error "latest.yml missing — electron-updater metadata required for auto-update"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: qClip ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          files: |
            apps/desktop/release/qClip-Setup-win-x64.exe
            apps/desktop/release/latest.yml
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Scaffold until Apple Silicon DMG builds are green (§5.2–5.3).
  # continue-on-error: Windows release must not block on macOS until notarization path is ready.
  macos-installer:
    runs-on: macos-latest
    timeout-minutes: 180
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag or input
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then
            REF="${{ github.ref_name }}"
            case "$REF" in v*) VER="${REF#v}" ;; esac
          fi
          VER="${VER:-0.0.0-ci}"
          echo "Building version $VER"
          node --input-type=commonjs -e "
          const fs = require('fs');
          const path = 'apps/desktop/package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.version = process.argv[1];
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          " -- "$VER"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            apps/desktop/package-lock.json

      - name: Install Python desktop + packaging deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-desktop.txt -r requirements-packaging.txt

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Electron deps
        working-directory: apps/desktop
        run: npm ci

      - name: Download ffmpeg macOS binaries
        run: |
          chmod +x scripts/download_ffmpeg_macos.sh
          ./scripts/download_ffmpeg_macos.sh

      - name: Build macOS DMG (arm64)
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/build_desktop_installer_macos.sh \
            scripts/build_desktop_ui.sh \
            scripts/notarize_macos_artifact.sh \
            scripts/verify_desktop_installer_macos.sh
          ./scripts/build_desktop_installer_macos.sh

      - name: Verify DMG artifact
        run: |
          if [ -f apps/desktop/release/qClip-mac-arm64.dmg ]; then
            ./scripts/verify_desktop_installer_macos.sh apps/desktop/release/qClip-mac-arm64.dmg
          else
            echo "::error::DMG not produced — check PyInstaller sidecar + electron-builder logs"
            exit 1
          fi

      - name: Upload macOS DMG to release (tag builds only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: apps/desktop/release/qClip-mac-arm64.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
