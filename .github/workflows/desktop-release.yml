# Build Windows NSIS installer and publish to GitHub Releases.
# Trigger: push tag v* (e.g. v1.0.0) or manual workflow_dispatch.
# Download URL (stable): .../releases/latest/download/StreamClip-Setup-win-x64.exe
name: Desktop release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0-beta.1)"
        required: false
        default: "1.0.0-beta.1"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag or input
        shell: pwsh
        run: |
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $ref = "${{ github.ref_name }}"
            if ($ref -match '^v(.+)$') { $ver = $Matches[1] }
          }
          if (-not $ver) { $ver = "0.0.0-ci" }
          Write-Host "Building version $ver"
          $pkg = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content apps/desktop/package.json -Encoding utf8

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Python packaging deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-desktop.txt -r requirements-packaging.txt

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Install Electron deps
        working-directory: apps/desktop
        run: npm ci

      - name: Build NSIS installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: .\scripts\build_desktop_installer.ps1

      - name: Verify installer exists
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release -Filter "StreamClip-Setup-win-x64.exe" -ErrorAction Stop
          $mb = [math]::Round($exe.Length / 1MB)
          Write-Host "Installer: $($exe.FullName) ($mb MB)"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          name: StreamClip ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
          files: |
            apps/desktop/release/StreamClip-Setup-win-x64.exe
            apps/desktop/release/latest.yml
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
