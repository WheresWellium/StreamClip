# Jet Stream / StreamClip — public documentation site (Wellium)
# Build: pip install -r docs/requirements.txt && python -m mkdocs build --strict
# Dev:   python -m mkdocs serve -a 127.0.0.1:8001
# Deploy: Vercel (vercel.json) — see README § Documentation

site_name: qClip Docs
site_description: Install qClip, create your first clip, and get help — beta docs for creators
site_url: https://streamclip-henna.vercel.app/
repo_url: https://github.com/WheresWellium/StreamClip
repo_name: streamclip
edit_uri: edit/master/docs/
copyright: Copyright &copy; 2026 Wellium — FJ Cantwell II

docs_dir: docs
site_dir: site
strict: true

# Keep customer henna lean. Operator/engineering files stay in-repo but are not published.
# See docs/INTERNAL.md for the full internal register.
exclude_docs: |
  GAP_ANALYSIS.md
  MASTER_TODO.md
  INTERNAL.md
  OPS_ALERTING.md
  BETA_OPS_PHASE0.md
  BETA_GO_LIVE.md
  BETA_ON_CALL.md
  BETA_INVITE_PACK.md
  BETA_TESTER_PLAN.md
  BETA_COHORT_EXIT.md
  BETA_DISTRIBUTION.md
  BETA_OBSERVABILITY.md
  SESSION_STATE.md
  AGENT_COORDINATION.md
  MACOS_INSTALLER.md
  DESKTOP_SIGNING.md
  CLEAN_VM_VERIFY.md
  CREATOR_PLATFORM.md
  PERFORMANCE.md
  TECHNICAL_DESIGN.md
  THEME_SKINS.md
  FIGMA_LINKS.md
  ADR-001-desktop-packaging.md
  cloud-deploy.md
  distribution-runbook.md
  .agent-lock.example.json
  commercial/
  evidence/
  superpowers/
  design/
  tutorials/TUTORIAL_INSTALL.md
  tutorials/TUTORIAL_GPU_SETUP.md
  tutorials/TUTORIAL_EDIT_APPROVE.md
  tutorials/TUTORIAL_VAULT.md
  tutorials/TUTORIAL_FIRST_JOB.md
  tutorials/TUTORIAL_PUBLISH_YOUTUBE.md

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# Customer journey only — one forward path: Install → First clip → Help
nav:
  - Home: index.md
  - Install: BETA_DOWNLOAD.md
  - First clip: BETA_TESTER_QUICKSTART.md
  - Help:
      - FAQ: BETA_FAQ.md
      - Known issues: BETA_KNOWN_ISSUES.md
      - Troubleshooting: tutorials/TUTORIAL_TROUBLESHOOTING.md

extra:
  generator: false
