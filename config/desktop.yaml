# qClip desktop / single-machine profile (ADR-001 §4.1–4.2)
# Embedded runtime: SQLite + in-process queue (no Docker, Celery, or Redis).
#
# Usage:
#   set STREAMCLIP_CONFIG=config/desktop.yaml
#   python -m desktop_sidecar
#
# Packaged installs use %LOCALAPPDATA%\qClip (Windows) or
# ~/Library/Application Support/qClip (macOS). Override:
#   set STREAMCLIP_DESKTOP_DATA_DIR=C:\path\to\qClip

database:
  # Dev-relative DB; packaged sidecar rewrites into the app-data directory.
  url: sqlite+aiosqlite:///./workspace/streamclip.db
  sync_url: sqlite:///./workspace/streamclip.db

storage:
  backend: local
  local_root: workspace/storage

queue:
  backend: inprocess
  default_workers: 2
  gpu_workers: 1

# Whisper: CPU-safe defaults for first-run desktops (no Docker GPU assumption).
# Sidecar upgrades device to cuda/mps via core/gpu_profile.py when available.
whisper:
  model_size: medium
  device: auto
  compute_type: int8

export:
  codec: auto

ffmpeg:
  bin_dir: bin/ffmpeg

# Desktop LLM (§4.4): no bundled Ollama. Point at a hosted provider via env:
#   set STREAMCLIP_LLM__PROVIDER=openai        (or anthropic)
#   set STREAMCLIP_LLM__MODEL=gpt-4o-mini
#   set STREAMCLIP_LLM__API_KEY=sk-...
# Without a key, virality LLM scoring degrades to 0 and the audio/visual
# ensemble still ranks clips. Local Ollama also works if installed.
llm:
  provider: ollama
  base_url: http://localhost:11434
  timeout_secs: 30

rate_limit:
  enabled: false

web:
  serve_static: true
  static_dir: static/ui

# Social distribution (OAuth redirects must match the Electron UI origin).
# Packaged boots auto-generate TOKEN_ENCRYPTION_KEY into app-data when unset.
distribution:
  web_origin: http://127.0.0.1:8765
  youtube_publish_enabled: true
  # Keep off until TikTok developer app audit grants video.publish / inbox approval.
  tiktok_publish_enabled: false
