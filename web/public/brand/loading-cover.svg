<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-hidden="true">
  <title>Jet Stream loading cover</title>
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a1c22"/>
      <stop offset="42%" stop-color="#0d2a33"/>
      <stop offset="72%" stop-color="#0a181e"/>
      <stop offset="100%" stop-color="#050c10"/>
    </linearGradient>
    <radialGradient id="horizon" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="35%" stop-color="#0ea5e9" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="40%" r="28%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#horizon)"/>
  <ellipse cx="800" cy="390" rx="420" ry="180" fill="url(#orb)"/>

  <!-- Distant grid plane -->
  <g stroke="#e8f7ff" stroke-opacity="0.07" fill="none" stroke-width="1">
    <path d="M0 520 L800 430 L1600 520"/>
    <path d="M80 560 L800 445 L1520 560"/>
    <path d="M160 610 L800 465 L1440 610"/>
    <path d="M260 680 L800 495 L1340 680"/>
    <path d="M400 780 L800 540 L1200 780"/>
    <path d="M560 430 L420 900"/>
    <path d="M680 420 L600 900"/>
    <path d="M800 415 L800 900"/>
    <path d="M920 420 L1000 900"/>
    <path d="M1040 430 L1180 900"/>
  </g>

  <!-- Soft floor wash -->
  <rect x="0" y="520" width="1600" height="380" fill="url(#floor)"/>

  <!-- Constellation / telemetry marks -->
  <g fill="#e0f2fe">
    <circle cx="260" cy="160" r="1.6" opacity="0.55"/>
    <circle cx="320" cy="210" r="1.1" opacity="0.35"/>
    <circle cx="1180" cy="140" r="1.4" opacity="0.45"/>
    <circle cx="1280" cy="220" r="1.2" opacity="0.4"/>
    <circle cx="1400" cy="180" r="1.8" opacity="0.5"/>
    <circle cx="420" cy="120" r="1.3" opacity="0.4"/>
    <circle cx="980" cy="110" r="1.5" opacity="0.35"/>
  </g>

  <!-- Thin frame accents -->
  <g fill="none" stroke="#38bdf8" stroke-opacity="0.28" stroke-width="1.25">
    <path d="M72 72h64M72 72v64"/>
    <path d="M1528 72h-64M1528 72v64"/>
    <path d="M72 828h64M72 828v-64"/>
    <path d="M1528 828h-64M1528 828v-64"/>
  </g>

  <!-- Horizon line -->
  <line x1="180" y1="448" x2="1420" y2="448" stroke="#7dd3fc" stroke-opacity="0.22" stroke-width="1"/>
</svg>
