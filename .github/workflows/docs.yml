name: Docs

on:
  push:
    branches: [main, master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "docs/requirements.txt"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Build site
        # Customer-facing docs ship on Vercel (henna). This job only gates
        # MkDocs --strict so doc breaks fail CI without requiring GitHub Pages.
        run: mkdocs build --strict
